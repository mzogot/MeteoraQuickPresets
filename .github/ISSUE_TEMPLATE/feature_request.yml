name: Feature request
description: Suggest something Meteora Quick Presets should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to get done, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The steps you take in Meteora's panel now.
